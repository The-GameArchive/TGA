<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drive Mad</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      width: 100vw; height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── LOADING SCREEN ── */
    #splash {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0d0d0d;
      transition: opacity 0.6s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }

    .logo-wrap {
      position: relative;
      width: 120px; height: 120px;
      margin-bottom: 28px;
    }
    .logo-ring {
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #f97316;
      animation: spin 1s linear infinite;
    }
    .logo-inner {
      position: absolute; inset: 10px;
      background: #1c1c1c;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 44px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .game-title {
      font-size: 2.2rem; font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #f97316, #fb923c, #fdba74);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .game-sub {
      font-size: 0.82rem; color: #555;
      margin-bottom: 36px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .progress-track {
      width: 280px; height: 5px;
      background: #222;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #f97316, #fb923c);
      border-radius: 99px;
      width: 0%;
      transition: width 0.3s ease;
    }
    .progress-label {
      font-size: 0.75rem; color: #444;
      letter-spacing: 0.05em;
    }
    #status-msg {
      margin-top: 10px;
      font-size: 0.72rem; color: #383838;
      letter-spacing: 0.03em;
    }

    /* ── GAME FRAME ── */
    #game-wrap {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #000;
    }
    #unity-canvas {
      width: 100%; height: 100%;
      display: block;
    }

    /* ── HUD ── */
    #hud {
      position: fixed; top: 12px; right: 14px;
      display: flex; gap: 8px;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.4s;
    }
    #hud.visible { opacity: 1; }
    #hud button {
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.12);
      color: #ccc;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.75rem;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.2s, color 0.2s;
      letter-spacing: 0.04em;
    }
    #hud button:hover {
      background: rgba(249,115,22,0.7);
      color: #fff;
      border-color: transparent;
    }

    /* ── ERROR ── */
    #err-box {
      display: none;
      position: fixed; inset: 0; z-index: 9999;
      background: #0d0d0d;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 16px; padding: 32px;
      text-align: center;
    }
    #err-box.visible { display: flex; }
    #err-box h2 { color: #f97316; font-size: 1.4rem; }
    #err-box p  { color: #666; font-size: 0.85rem; max-width: 420px; line-height: 1.6; }
    #err-box button {
      background: #f97316; color: #fff; border: none;
      padding: 10px 24px; border-radius: 8px;
      font-size: 0.85rem; cursor: pointer;
    }
  </style>
</head>
<body>

<div id="splash">
  <div class="logo-wrap">
    <div class="logo-ring"></div>
    <div class="logo-inner">🚗</div>
  </div>
  <div class="game-title">Drive Mad</div>
  <div class="game-sub">by Martin Magni</div>
  <div class="progress-track"><div class="progress-fill" id="pbar"></div></div>
  <div class="progress-label"><span id="pct">0</span>%</div>
  <div id="status-msg">Connecting…</div>
</div>

<div id="err-box">
  <h2>⚠️ Could not load Drive Mad</h2>
  <p id="err-detail">The game files couldn't be reached. Make sure you're connected to the internet and try again.</p>
  <button onclick="location.reload()">Retry</button>
</div>

<div id="game-wrap">
  <canvas id="unity-canvas" tabindex="1"></canvas>
</div>

<div id="hud">
  <button id="btn-fs">⛶ Fullscreen</button>
  <button id="btn-reload">↺ Reload</button>
</div>

<script>
(function () {
  'use strict';

  /* ═══════════════════════════════════════════════════════════════════════
   *  SOURCE:  github.com/Ducky443747/ducky443747.github.io  (public repo)
   *  GAME:    games/DriveMad/
   *  ALL ASSETS SERVED VIA: cdn.jsdelivr.net  (school-allowed)
   * ═══════════════════════════════════════════════════════════════════════ */
  const CDN_BASE    = 'https://cdn.jsdelivr.net/gh/Ducky443747/ducky443747.github.io@main/games/DriveMad/';
  const ORIGIN_BASE = 'https://ducky443747.github.io/games/DriveMad/';

  /* ── UI ──────────────────────────────────────────────────────────────── */
  const pbar      = document.getElementById('pbar');
  const pct       = document.getElementById('pct');
  const statusMsg = document.getElementById('status-msg');
  const splash    = document.getElementById('splash');
  const hud       = document.getElementById('hud');
  const errBox    = document.getElementById('err-box');
  const errDetail = document.getElementById('err-detail');
  const canvas    = document.getElementById('unity-canvas');

  function setProgress(p, msg) {
    pbar.style.width = Math.min(100, Math.round(p)) + '%';
    pct.textContent  = Math.min(100, Math.round(p));
    if (msg) statusMsg.textContent = msg;
  }
  function showError(msg) {
    errDetail.textContent = msg || 'Unknown error.';
    errBox.classList.add('visible');
    splash.classList.add('hidden');
  }
  function hideSplash() {
    splash.classList.add('hidden');
    hud.classList.add('visible');
    canvas.focus();
  }

  /* ── URL remapper ────────────────────────────────────────────────────── */
  function remapUrl(url) {
    if (!url || typeof url !== 'string') return url;

    // Never touch blob: or data: or already-CDN URLs
    if (url.startsWith('blob:') || url.startsWith('data:')) return url;
    if (url.startsWith(CDN_BASE)) return url;

    // Absolute github.io origin → swap prefix to jsDelivr
    if (url.startsWith(ORIGIN_BASE)) {
      return CDN_BASE + url.slice(ORIGIN_BASE.length);
    }

    // file:// (opened from local disk / Google Drive file)
    if (url.startsWith('file://')) {
      const bare = url.replace(/^.*[/\\]/, '');
      return CDN_BASE + bare;
    }

    // Relative paths (no scheme) — produced by the Unity loader
    if (!url.startsWith('http://') && !url.startsWith('https://')) {
      return CDN_BASE + url.replace(/^\.?\//, '');
    }

    // Any other absolute URL (Unity engine CDN, telemetry, etc.) — leave alone
    return url;
  }

  /* ── Interceptors (install BEFORE any game JS runs) ─────────────────── */

  // XMLHttpRequest
  const _XHROpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (method, url, ...rest) {
    return _XHROpen.call(this, method, remapUrl(url), ...rest);
  };

  // fetch()
  const _fetch = window.fetch;
  window.fetch = function (resource, opts) {
    if (typeof resource === 'string') {
      resource = remapUrl(resource);
    } else if (resource instanceof Request) {
      const mapped = remapUrl(resource.url);
      if (mapped !== resource.url) resource = new Request(mapped, resource);
    }
    return _fetch.call(this, resource, opts);
  };

  // Worker (Unity streams WASM via a worker)
  const _Worker = window.Worker;
  window.Worker = function (url, opts) {
    return new _Worker(remapUrl(String(url)), opts);
  };
  window.Worker.prototype = _Worker.prototype;

  // HTMLImageElement.src (some Unity builds load textures as images)
  const _imgDesc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
  if (_imgDesc && _imgDesc.set) {
    Object.defineProperty(HTMLImageElement.prototype, 'src', {
      set(v) { _imgDesc.set.call(this, remapUrl(v)); },
      get()  { return _imgDesc.get.call(this); },
      configurable: true,
    });
  }

  /* ── Detect Build config from the game's index.html ─────────────────── */
  async function detectConfig() {
    setProgress(5, 'Fetching game config…');
    const resp = await fetch(CDN_BASE + 'index.html');
    if (!resp.ok) throw new Error(`jsDelivr: HTTP ${resp.status} on index.html`);
    const html = await resp.text();

    function extract(re) {
      const m = html.match(re);
      if (!m) return null;
      const p = m[1];
      if (p.startsWith('http')) return p;
      // Resolve relative path against CDN_BASE
      return CDN_BASE + p.replace(/^[./\\]+/, '');
    }

    const loaderUrl    = extract(/loaderUrl\s*[:=]\s*["'`]([^"'`]+)["'`]/);
    const dataUrl      = extract(/dataUrl\s*[:=]\s*["'`]([^"'`]+)["'`]/);
    const frameworkUrl = extract(/frameworkUrl\s*[:=]\s*["'`]([^"'`]+)["'`]/);
    const codeUrl      = extract(/codeUrl\s*[:=]\s*["'`]([^"'`]+)["'`]/);
    const streamMatch  = html.match(/streamingAssetsUrl\s*[:=]\s*["'`]([^"'`]+)["'`]/);
    const streamingAssetsUrl = streamMatch
      ? CDN_BASE + streamMatch[1].replace(/^[./\\]+/, '')
      : CDN_BASE + 'StreamingAssets';

    console.log('[DriveMad] Detected build config:', { loaderUrl, dataUrl, frameworkUrl, codeUrl });
    return { loaderUrl, dataUrl, frameworkUrl, codeUrl, streamingAssetsUrl };
  }

  /* ── Boot Unity directly ─────────────────────────────────────────────── */
  async function bootUnity(cfg) {
    setProgress(15, 'Loading engine…');

    await new Promise((resolve, reject) => {
      const s  = document.createElement('script');
      s.src    = cfg.loaderUrl;
      s.onload = resolve;
      s.onerror = () => reject(new Error('Unity loader script failed to load from jsDelivr'));
      document.body.appendChild(s);
    });

    if (typeof createUnityInstance !== 'function') {
      throw new Error('createUnityInstance() not found after loader script ran.');
    }

    setProgress(20, 'Initialising…');
    canvas.style.width  = '100%';
    canvas.style.height = '100%';

    const config = {
      dataUrl:            cfg.dataUrl,
      frameworkUrl:       cfg.frameworkUrl,
      codeUrl:            cfg.codeUrl,
      streamingAssetsUrl: cfg.streamingAssetsUrl,
      companyName:        'MartinMagni',
      productName:        'DriveMad',
      productVersion:     '1.0',
    };
    Object.keys(config).forEach(k => {
      if (config[k] == null) delete config[k];
    });

    await createUnityInstance(canvas, config, (p) => {
      setProgress(20 + p * 80, p < 1 ? 'Loading game…' : 'Almost there…');
    });

    setProgress(100, 'Ready!');
    setTimeout(hideSplash, 300);
  }

  /* ── Fallback: srcdoc iframe with <base> tag ─────────────────────────── */
  async function fallbackIframe() {
    setProgress(5, 'Trying iframe fallback…');
    const wrap = document.getElementById('game-wrap');
    wrap.innerHTML = '';

    let html;
    const r = await fetch(CDN_BASE + 'index.html');
    if (!r.ok) throw new Error(`jsDelivr: HTTP ${r.status} on index.html`);
    html = await r.text();

    // Inject <base href="CDN_BASE"> so all relative URLs resolve via jsDelivr
    const injected = html.replace(/(<head[^>]*>)/i, `$1<base href="${CDN_BASE}">`);

    const iframe = document.createElement('iframe');
    iframe.sandbox = 'allow-scripts allow-same-origin allow-pointer-lock allow-popups';
    iframe.style.cssText = 'width:100%;height:100%;border:none;display:block;';
    iframe.setAttribute('allowfullscreen', '');
    iframe.srcdoc = injected;
    iframe.onload = () => {
      setProgress(100, 'Ready!');
      setTimeout(hideSplash, 400);
    };
    wrap.appendChild(iframe);
  }

  /* ── Main ────────────────────────────────────────────────────────────── */
  async function main() {
    try {
      const cfg = await detectConfig();
      setProgress(10, 'Got build config…');

      if (!cfg.loaderUrl || !cfg.dataUrl || !cfg.frameworkUrl || !cfg.codeUrl) {
        console.warn('[DriveMad] Incomplete config, using iframe fallback.');
        await fallbackIframe();
        return;
      }

      await bootUnity(cfg);
    } catch (e) {
      console.error('[DriveMad] Direct boot failed:', e.message);
      try {
        await fallbackIframe();
      } catch (e2) {
        showError(e.message + '\n\n' + e2.message);
      }
    }
  }

  /* ── HUD ─────────────────────────────────────────────────────────────── */
  document.getElementById('btn-fs').addEventListener('click', () => {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else {
      (document.getElementById('game-wrap')).requestFullscreen?.()
        || document.documentElement.webkitRequestFullscreen?.();
    }
  });
  document.getElementById('btn-reload').addEventListener('click', () => location.reload());

  // Backtick boss key
  document.addEventListener('keydown', e => {
    if (e.key === '`') window.location.replace('https://google.com');
  });

  main();
})();
</script>
</body>
</html>
