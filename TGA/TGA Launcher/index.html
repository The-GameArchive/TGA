<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── THEMES ── */
:root{
  --bg:#0a0a0f;--bg3:#16162a;--card:#12121e;--card2:#1a1a2e;
  --a:#7c3aed;--a2:#a855f7;--neon:#c084fc;--glow:rgba(124,58,237,.35);
  --tx:#e2e8f0;--mu:#64748b;--bo:rgba(124,58,237,.2);
  --grid-color:rgba(124,58,237,.03);
  --news-bg:rgba(124,58,237,.08);--news-border:rgba(124,58,237,.3);
  --news-accent:#a855f7;
}
[data-theme="cyber"]{
  --bg:#010a04;--bg3:#071a0e;--card:#081207;--card2:#0d1f0e;
  --a:#00ff41;--a2:#39ff14;--neon:#7fff7f;--glow:rgba(0,255,65,.3);
  --tx:#ccffcc;--mu:#4a7a50;--bo:rgba(0,255,65,.18);
  --grid-color:rgba(0,255,65,.03);
  --news-bg:rgba(0,255,65,.07);--news-border:rgba(0,255,65,.3);
  --news-accent:#39ff14;
}
[data-theme="fire"]{
  --bg:#0d0500;--bg3:#1f0c00;--card:#160800;--card2:#241000;
  --a:#f97316;--a2:#fb923c;--neon:#fcd34d;--glow:rgba(249,115,22,.35);
  --tx:#fef3c7;--mu:#78716c;--bo:rgba(249,115,22,.2);
  --grid-color:rgba(249,115,22,.03);
  --news-bg:rgba(249,115,22,.08);--news-border:rgba(249,115,22,.3);
  --news-accent:#fb923c;
}
[data-theme="ocean"]{
  --bg:#000d1a;--bg3:#001a33;--card:#001022;--card2:#00192e;
  --a:#0ea5e9;--a2:#38bdf8;--neon:#7dd3fc;--glow:rgba(14,165,233,.3);
  --tx:#e0f2fe;--mu:#475569;--bo:rgba(14,165,233,.2);
  --grid-color:rgba(14,165,233,.03);
  --news-bg:rgba(14,165,233,.08);--news-border:rgba(14,165,233,.3);
  --news-accent:#38bdf8;
}
[data-theme="rose"]{
  --bg:#0f000a;--bg3:#200015;--card:#18000f;--card2:#26001a;
  --a:#e879f9;--a2:#f0abfc;--neon:#fde8ff;--glow:rgba(232,121,249,.3);
  --tx:#fce7ff;--mu:#6b4875;--bo:rgba(232,121,249,.2);
  --grid-color:rgba(232,121,249,.03);
  --news-bg:rgba(232,121,249,.08);--news-border:rgba(232,121,249,.3);
  --news-accent:#f0abfc;
}
[data-theme="matrix"]{
  --bg:#000000;--bg3:#050505;--card:#050505;--card2:#0a0a0a;
  --a:#00b300;--a2:#00e600;--neon:#33ff33;--glow:rgba(0,230,0,.3);
  --tx:#d0ffd0;--mu:#3a5c3a;--bo:rgba(0,230,0,.15);
  --grid-color:rgba(0,230,0,.025);
  --news-bg:rgba(0,230,0,.06);--news-border:rgba(0,230,0,.25);
  --news-accent:#00e600;
}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(var(--grid-color) 1px,transparent 1px),linear-gradient(90deg,var(--grid-color) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;transition:background .3s}

/* ── HEADER ── */
header{position:sticky;top:0;z-index:100;background:rgba(10,10,15,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--bo);padding:0 1.5rem;transition:border-color .3s}
.hi{max-width:1800px;margin:0 auto;display:flex;align-items:center;gap:1.5rem;height:64px}
.logo{font-family:'Orbitron',monospace;font-weight:900;font-size:1.35rem;letter-spacing:.2em;background:linear-gradient(135deg,var(--a2),var(--neon));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;flex-shrink:0;transition:all .3s}
.logo span{-webkit-text-fill-color:rgba(255,255,255,.3);font-size:.7em;letter-spacing:.3em;margin-left:.4em;font-weight:400}
.sw{flex:1;max-width:560px;position:relative}
.sw svg{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--mu);width:17px;height:17px;pointer-events:none}
#search{width:100%;background:var(--bg3);border:1px solid var(--bo);border-radius:10px;padding:.55rem .9rem .55rem 2.5rem;color:var(--tx);font-family:'Rajdhani',sans-serif;font-size:.95rem;font-weight:500;outline:none;transition:border-color .2s,box-shadow .2s,background .3s}
#search::placeholder{color:var(--mu)}
#search:focus{border-color:var(--a);box-shadow:0 0 0 3px var(--glow)}
.cb{font-size:.82rem;color:var(--mu);flex-shrink:0}
.cb strong{color:var(--neon);font-size:.95rem}
.header-right{display:flex;align-items:center;gap:.75rem;flex-shrink:0}

/* ── SETTINGS BUTTON ── */
.settings-btn{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;background:var(--bg3);border:1px solid var(--bo);color:var(--mu);cursor:pointer;transition:all .18s;flex-shrink:0}
.settings-btn:hover{background:var(--card2);border-color:var(--a);color:var(--neon);box-shadow:0 0 12px var(--glow)}
.settings-btn svg{width:18px;height:18px;transition:transform .4s}
.settings-btn:hover svg{transform:rotate(60deg)}

/* ── TABS ── */
.tabs{position:sticky;top:64px;z-index:90;background:rgba(10,10,15,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--bo);padding:0 1.5rem;transition:border-color .3s}
.ti{max-width:1800px;margin:0 auto;display:flex;gap:.2rem;padding:.5rem 0}
.tab{display:flex;align-items:center;gap:.45rem;padding:.42rem 1.1rem;border-radius:8px;background:transparent;border:1px solid transparent;color:var(--mu);font-family:'Orbitron',monospace;font-size:.65rem;font-weight:700;letter-spacing:.12em;cursor:pointer;transition:all .15s;text-transform:uppercase}
.tab:hover{background:var(--bg3);color:var(--tx);border-color:var(--bo)}
.tab.active{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;box-shadow:0 0 18px var(--glow)}
.tp{background:rgba(255,255,255,.15);border-radius:99px;padding:.08em .45em;font-size:.8em;font-family:'Rajdhani',sans-serif;font-weight:600}
.tab svg{width:15px;height:15px}

/* ── MAIN ── */
main{position:relative;z-index:1;max-width:1800px;margin:0 auto;padding:1.5rem}

/* ── ANNOUNCEMENTS BOX ── */
.announcements{background:var(--news-bg);border:1px solid var(--news-border);border-radius:14px;padding:1rem 1.25rem;margin-bottom:1.25rem;position:relative;overflow:hidden;transition:background .3s,border-color .3s}
.announcements::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--news-bg),transparent);pointer-events:none}
.ann-header{display:flex;align-items:center;gap:.6rem;margin-bottom:.75rem}
.ann-icon{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--a),var(--a2));display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 10px var(--glow)}
.ann-icon svg{width:15px;height:15px;color:#fff}
.ann-title{font-family:'Orbitron',monospace;font-size:.7rem;font-weight:700;letter-spacing:.15em;color:var(--news-accent);text-transform:uppercase}
.ann-pulse{width:8px;height:8px;border-radius:50%;background:var(--news-accent);box-shadow:0 0 6px var(--news-accent);animation:pulse 2s infinite;flex-shrink:0;margin-left:auto}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.ann-items{display:flex;flex-direction:column;gap:.4rem}
.ann-item{display:flex;align-items:flex-start;gap:.55rem;font-size:.88rem;font-weight:500;color:var(--tx);line-height:1.4}
.ann-item::before{content:'▸';color:var(--news-accent);font-size:.75rem;margin-top:.1rem;flex-shrink:0}
.ann-empty{font-size:.82rem;color:var(--mu);font-style:italic;font-family:'Rajdhani',sans-serif}
.ann-date{font-size:.72rem;color:var(--mu);margin-left:auto;flex-shrink:0;white-space:nowrap}

/* ── GAME GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:.85rem}
.card{background:var(--card);border:1px solid var(--bo);border-radius:13px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .16s,box-shadow .16s,border-color .16s,background .3s;animation:fi .22s ease both}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.card:hover{transform:translateY(-3px) scale(1.02);border-color:var(--a2);box-shadow:0 8px 28px var(--glow),0 0 0 1px rgba(168,85,247,.3);background:var(--card2)}
.card:hover .ct img,.card:hover .ph{transform:scale(1.06)}
.ct{aspect-ratio:4/3;overflow:hidden;position:relative;background:var(--bg3)}
.ct img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .28s}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-weight:900;font-size:2.2rem;transition:transform .28s}
.cr{position:absolute;top:7px;right:7px;font-family:'Orbitron',monospace;font-size:.5rem;letter-spacing:.08em;padding:.18em .5em;border-radius:4px;font-weight:700;text-transform:uppercase;pointer-events:none}
.cg{background:rgba(30,58,95,.92);color:#60a5fa;border:1px solid rgba(96,165,250,.25)}
.ct2{background:rgba(26,58,26,.92);color:#4ade80;border:1px solid rgba(74,222,128,.25)}
.ce{background:rgba(58,26,26,.92);color:#f87171;border:1px solid rgba(248,113,113,.25)}
.ci{padding:.55rem .65rem .65rem}
.cn{font-size:.8rem;font-weight:600;line-height:1.3;color:var(--tx);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{grid-column:1/-1;text-align:center;padding:4rem 2rem;color:var(--mu);font-family:'Orbitron',monospace;font-size:.8rem;letter-spacing:.1em}
.ei{font-size:2.5rem;margin-bottom:1rem;opacity:.3}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--a);border-radius:99px}

/* ── SETTINGS MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--bg3);border:1px solid var(--bo);border-radius:18px;padding:1.75rem;width:min(480px,92vw);max-height:88vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.6);transform:translateY(16px) scale(.97);transition:transform .22s,background .3s,border-color .3s}
.modal-overlay.open .modal{transform:translateY(0) scale(1)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.modal-title{font-family:'Orbitron',monospace;font-size:.9rem;font-weight:900;letter-spacing:.15em;background:linear-gradient(135deg,var(--a2),var(--neon));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.modal-close{width:30px;height:30px;border-radius:7px;background:transparent;border:1px solid var(--bo);color:var(--mu);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:1rem;line-height:1}
.modal-close:hover{background:var(--card2);border-color:var(--a);color:var(--tx)}
.section-label{font-family:'Orbitron',monospace;font-size:.6rem;font-weight:700;letter-spacing:.18em;color:var(--mu);text-transform:uppercase;margin-bottom:.6rem}
.modal-section{margin-bottom:1.5rem}

/* Theme picker */
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.theme-card{border-radius:11px;border:2px solid transparent;padding:.65rem .5rem .55rem;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:.35rem;background:var(--card);position:relative}
.theme-card:hover{border-color:var(--a);transform:translateY(-2px)}
.theme-card.selected{border-color:var(--a2);box-shadow:0 0 16px var(--glow)}
.theme-card.selected::after{content:'✓';position:absolute;top:5px;right:7px;font-size:.65rem;color:var(--neon);font-weight:700}
.theme-swatch{width:100%;height:24px;border-radius:6px;margin-bottom:.1rem}
.theme-name{font-family:'Orbitron',monospace;font-size:.5rem;letter-spacing:.1em;color:var(--mu);text-transform:uppercase}

/* Tab name input */
.tab-name-row{display:flex;gap:.5rem}
#tab-name-input{flex:1;background:var(--card);border:1px solid var(--bo);border-radius:9px;padding:.5rem .8rem;color:var(--tx);font-family:'Rajdhani',sans-serif;font-size:.95rem;font-weight:500;outline:none;transition:border-color .2s,box-shadow .2s}
#tab-name-input:focus{border-color:var(--a);box-shadow:0 0 0 3px var(--glow)}
.btn-apply{background:linear-gradient(135deg,var(--a),var(--a2));border:none;border-radius:9px;padding:.5rem 1rem;color:#fff;font-family:'Orbitron',monospace;font-size:.6rem;font-weight:700;letter-spacing:.1em;cursor:pointer;transition:all .18s;white-space:nowrap}
.btn-apply:hover{box-shadow:0 0 16px var(--glow);filter:brightness(1.1)}


</style>
</head>

<div class="tabs">

    Emulators <span class="tp" id="pe">0</span>

</div>
</div>

<main>
  <!-- Announcements Box -->
  <div class="announcements" id="announcements-box">
    <div class="ann-header">
      <div class="ann-icon">
        <svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      </div>
      <span class="ann-title">News &amp; Announcements</span>
      <span class="ann-pulse"></span>
    </div>

<!-- Settings Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">⚙ Settings</span>
      <button class="modal-close" id="modal-close">✕</button>
    </div>

    <!-- Tab Name -->
    <div class="modal-section">
      <div class="section-label">Tab / Window Title</div>
      <div class="tab-name-row">
        <input type="text" id="tab-name-input" placeholder="e.g. TGA Launcher" maxlength="60">

          <span class="theme-name">Matrix</span>
        </div>
      </div>
    </div>


  </div>
</div>

/* ══════════════════════════════
   CARD COLORS
══════════════════════════════ */
const CC={game:['#1a2e4a','#60a5fa'],tool:['#1a3a1a','#4ade80'],emulator:['#3a1a1a','#f87171']};
function initials(n){return n.trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?'}
function mkPh(name,cat){
  const[bg,fg]=CC[cat]||['#1e1e3a','#a855f7'];
  const d=document.createElement('div');d.className='ph';
  d.style.cssText='background:linear-gradient(135deg,'+bg+',#0a0a0f);color:'+fg+';opacity:.82;';
  d.textContent=initials(name);return d;
}
function buildCard(row){
  const[name,cat,path,img]=row;
  const a=document.createElement('a');a.className='card';a.href=path;a.target='_blank';a.rel='noopener';
  const ct=document.createElement('div');ct.className='ct';
  if(img){
    const el=document.createElement('img');el.src=img;el.alt=name;
    el.onerror=function(){this.style.display='none';ct.insertBefore(mkPh(name,cat),this);};
    ct.appendChild(el);
  }else{ct.appendChild(mkPh(name,cat));}
  const cr=document.createElement('span');
  cr.className='cr '+({game:'cg',tool:'ct2',emulator:'ce'}[cat]||'cg');
  cr.textContent=cat==='emulator'?'EMU':cat.toUpperCase();
  ct.appendChild(cr);
  const ci=document.createElement('div');ci.className='ci';
  const cn=document.createElement('div');cn.className='cn';cn.textContent=name;
  ci.appendChild(cn);a.appendChild(ct);a.appendChild(ci);return a;
}

/* ══════════════════════════════
   RENDER
══════════════════════════════ */
let filt='all',q='';
function render(){
  const grid=document.getElementById('grid');
  const ql=q.toLowerCase();
  const out=items.filter(r=>(filt==='all'||r[1]===filt)&&(!ql||r[0].toLowerCase().includes(ql)));
  grid.innerHTML='';
  if(!out.length){
    const e=document.createElement('div');e.className='empty';
    e.innerHTML='<div class="ei">&#128269;</div>No results for &ldquo;'+q+'&rdquo;';
    grid.appendChild(e);
  }else{
    out.forEach((row,i)=>{
      const c=buildCard(row);c.style.animationDelay=Math.min(i*.012,.3)+'s';
      grid.appendChild(c);
    });
  }
  document.getElementById('cn').textContent=out.length;
}
function pills(){
  document.getElementById('pa').textContent=items.length;
  document.getElementById('pg').textContent=items.filter(r=>r[1]==='game').length;
  document.getElementById('pt').textContent=items.filter(r=>r[1]==='tool').length;
  document.getElementById('pe').textContent=items.filter(r=>r[1]==='emulator').length;
}
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');filt=btn.dataset.f;render();
  });
});
document.getElementById('search').addEventListener('input',e=>{q=e.target.value;render();});

const overlay=document.getElementById('modal-overlay');

document.getElementById('modal-close').addEventListener('click',()=>overlay.classList.remove('open'));
overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('open');});

document.getElementById('apply-tab-name').addEventListener('click',()=>{
  const v=document.getElementById('tab-name-input').value.trim();

document.getElementById('tab-name-input').addEventListener('keydown',e=>{
  if(e.key==='Enter')document.getElementById('apply-tab-name').click();
});

/* ── THEME ── */
let currentTheme='default';
document.getElementById('theme-grid').addEventListener('click',e=>{
  const card=e.target.closest('.theme-card');
  if(!card)return;
  const theme=card.dataset.theme;
  document.querySelectorAll('.theme-card').forEach(c=>c.classList.remove('selected'));
  card.classList.add('selected');
  if(theme==='default'){document.documentElement.removeAttribute('data-theme');}
  else{document.documentElement.setAttribute('data-theme',theme);}
  currentTheme=theme;
});

/* ══════════════════════════════
   ANNOUNCEMENTS
   ── Add your announcements below ──
   Each line is one announcement.
   Example: 'New games added this week!',
══════════════════════════════ */
const announcements = [
  'They tried to take us down!',
  'We are back baby!',
];

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderAnnouncements(){
  const display=document.getElementById('ann-display');
  display.innerHTML='';
  if(!announcements.length){
    display.innerHTML='<span class="ann-empty">No announcements — add some in the code!</span>';
    return;
  }
  announcements.forEach(txt=>{
    const item=document.createElement('div');item.className='ann-item';
    item.innerHTML='<span>'+escHtml(txt)+'</span>';
    display.appendChild(item);
  });
}

/* ── INIT ── */
pills();render();renderAnnouncements();
</script>
